<html lang="es">
<head>

  <title>Ejercicio Tipografías</title>

  <!-- 6º párrafo: Montserrat con <link> -->

  <!-- CSS externo -->
  <link rel="stylesheet" href="estilos4.css">

<body>

  <p class="p4">Este es el cuarto párrafo con Roboto.</p>
